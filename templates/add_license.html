{% extends "base.html" %}

{% block title %}Add License - SLMS{% endblock %}
{% block page_title %}Add License{% endblock %}

{% block content %}
<div class="page-header">
    <h2 class="page-title">Add License</h2>
    <p class="page-subtitle">Create a new license entry in the system</p>
</div>

<div class="form-card">
    <div class="form-section">
        <h3 class="form-section-title">License Information</h3>
        
        <form method="POST" action="{{ url_for('add_license') }}">
            <div class="form-row">
                <div class="form-group">
                    <label for="name" class="form-label">License Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Enter license name" required>
                </div>
                
                <div class="form-group">
                    <label for="category" class="form-label">License Category</label>
                    <select id="category" name="category" class="form-select" required>
                        <option value="">Select a license category</option>
                        <option value="Document Editing">Document Editing</option>
                        <option value="Design & Graphics">Design & Graphics</option>
                        <option value="Coding & Development">Coding & Development</option>
                        <option value="Engineering Simulation">Engineering Simulation</option>
                        <option value="Multimedia">Multimedia</option>
                        <option value="Security">Security</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="key" class="form-label">License Key</label>
                    <input type="text" id="key" name="key" class="form-input" placeholder="XXXX-XXXX-XXXX-XXXX" required>
                </div>
                
                <div class="form-group">
                    <label for="department" class="form-label">Assigned Department</label>
                    <select id="department" name="department" class="form-select" required>
                        <option value="">Select department</option>
                        <option value="IT">IT</option>
                        <option value="Design Studio">Design Studio</option>
                        <option value="Computer Engineering">Computer Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Security">Security</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="assigned_user" class="form-label">Assigned User</label>
                    <select id="assigned_user" name="assigned_user" class="form-select" required>
                        <option value="">Select user</option>
                        {% for user in users %}
                        <option value="{{ user.username }}">{{ user.username }} ({{ user.role }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="start_date" class="form-label">Start Date</label>
                    <input type="date" id="start_date" name="start_date" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="expiry_date" class="form-label">Expiry Date</label>
                    <input type="date" id="expiry_date" name="expiry_date" class="form-input" required>
                </div>
            </div>
            
            <div class="form-actions">
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Add License</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
