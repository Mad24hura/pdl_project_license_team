{% extends "base.html" %}

{% block title %}Request New License - SLMS{% endblock %}
{% block page_title %}Request New License{% endblock %}

{% block content %}
<div class="page-header">
    <h2 class="page-title">Request New License</h2>
    <p class="page-subtitle">Submit a request for a new software license</p>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('request_license') }}" class="license-request-form">
        <div class="form-group">
            <label for="software" class="form-label">Software Name</label>
            <input type="text" id="software" name="software" class="form-input" placeholder="Enter software name" required>
        </div>
        
        <div class="form-group">
            <label for="device" class="form-label">Device to Assign</label>
            <input type="text" id="device" name="device" class="form-input" placeholder="Enter device name (e.g., LAB-PC-001)" required>
        </div>
        
        <div class="form-group">
            <label for="reason" class="form-label">Reason for Request</label>
            <textarea id="reason" name="reason" class="form-textarea" placeholder="Explain why you need this license" required></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <span class="btn-icon">📝</span>
                Submit Request
            </button>
            <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">
                <span class="btn-icon">↩️</span>
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
